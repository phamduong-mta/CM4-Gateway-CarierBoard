<text x="30.00" y="1245.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">Bo 150 × 105 mm, dày 1.6 mm, góc bo R3. Bốn lỗ M3 (Ø3.2, vành đồng Ø6.4) cách mép 4.5 mm.</text>
<text x="30.00" y="1267.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">RJ45 (HR911130A, rộng 16.1, cao 13.5) và USB-A nhô khỏi mép trước 2.0 mm; USB-C ≈ 0.1 mm; micro-USB ≈ 0.7 mm.</text>
<text x="30.00" y="1289.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">Jack DC nhô khỏi mép sau 0.5 mm. Bước giữa các cổng LAN: 18.2 mm.</text>
<text x="30.00" y="1311.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">Module CM4 gắn bằng 4 trụ M2.5 cao 1.5 mm (khoảng lỗ 33 × 48 mm); không có linh kiện mặt trên dưới module.</text>
<text x="30.00" y="1333.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">Linh kiện cao nhất: MX switch ≈ 15 mm (kể cả trục), RJ45 13.5 mm, tụ hóa 7.7 mm, cuộn cảm 4 mm.</text>
<text x="30.00" y="1355.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">Mặt dưới chỉ có linh kiện 0402/0603 (cao ≤ 1 mm) — trụ đỡ bo nên cao ≥ 3 mm.</text>
