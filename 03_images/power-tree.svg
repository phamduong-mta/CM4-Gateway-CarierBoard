<text x="1260.00" y="85.00" font-family="DejaVu Sans" font-size="15.0" text-anchor="middle" font-weight="bold" fill="#111">+3V3 do CM4 cấp ra (≤ 600 mA)</text>
<text x="1260.00" y="110.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#222">TPM SLB9670 (~25 mA) · CH340C (~10 mA)</text>
<text x="1260.00" y="131.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#222">FSUSB42 · LED · điện trở kéo</text>
<text x="1260.00" y="152.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#222">SRAM 23LCV1024 (VCC qua Q1102)</text>
<text x="1260.00" y="173.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#222">PERIPH_EN → bật U102, U103</text>
<text x="1260.00" y="194.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#222">V_KEEP = OR(+3V3, pin) → RTC, nhánh tamper</text>
