<text x="1155.00" y="723.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#333">≈ 2 µA khi rút điện</text>
<text x="1155.00" y="742.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#333">> 10 năm</text>
