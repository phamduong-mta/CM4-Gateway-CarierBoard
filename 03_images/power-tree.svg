<text x="1375.00" y="731.50" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#333">rail V_KEEP / V_SW</text>
<polyline points="1250.0,715.0 1290.0,715.0" fill="none" stroke="#c77700" stroke-width="2.5"/>
<polygon points="1290.0,715.0 1280.8,718.9 1280.8,711.1" fill="#c77700"/>
<rect x="30.00" y="560.00" width="650.00" height="220.00" rx="8.0" fill="#fafafa" stroke="#999" stroke-width="1.00" fill-opacity="1.00"/>
<text x="50.00" y="588.00" font-family="DejaVu Sans" font-size="16.0" text-anchor="start" font-weight="bold" fill="#111">Trình tự cấp nguồn</text>
<text x="50.00" y="615.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222">1. Cắm 12 V → U101 khởi động khi Vin > 7.9 V (UVLO) → +5V</text>
<text x="50.00" y="638.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222">2. CM4 tự khởi động: +3V3 → +1V8 → RUN_PG</text>
<text x="50.00" y="661.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222">3. +3V3 của CM4 kéo PERIPH_EN → U102 (+3V3_SW) và U103 (+1V0) cùng lên</text>
<text x="50.00" y="684.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222">4. CM4 nhả PCIe_nRST khi kernel khởi tạo PCIe (>100 ms sau khi nguồn ổn định)</text>
<text x="50.00" y="707.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222">5. SW1 nhả DWNRST# → NIC1, NIC2, SW2 → SW2 nhả reset cho NIC3, NIC4</text>
<text x="50.00" y="730.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222">Khi CM4 tắt (GLOBAL_EN thấp): +3V3 mất → toàn bộ rail ngoại vi tắt theo</text>
<text x="50.00" y="753.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#a33">⇒ không chân nào của CM4 bị cấp điện trước +5V (yêu cầu datasheet CM4 §5.1)</text>
<text x="40.00" y="110.00" font-family="DejaVu Sans" font-size="16.0" text-anchor="start" font-weight="bold" fill="#111">Ngân sách phía 12 V</text>
<text x="40.00" y="136.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">Tải +5V tối đa: 1.8 + 1.2 + 0.95 + 0.32 + 0.2 ≈ 4.5 A</text>
<text x="40.00" y="158.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">→ 22.5 W / 0.90 ≈ 25 W ≈ 2.1 A @ 12 V</text>
<text x="40.00" y="180.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">Điển hình (không USB, không quạt): ~12 W ≈ 1.0 A</text>
<text x="40.00" y="202.00" font-family="DejaVu Sans" font-size="13.5" text-anchor="start" font-weight="normal" fill="#111">Adapter: tối thiểu 12 V/2 A, khuyến nghị 12 V/3 A</text>
</svg>
