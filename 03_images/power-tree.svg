<text x="1260.00" y="418.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#111">4× RTL8111H: ~0.25 A mỗi chip (LDO nội → 1.0 V)</text>
<text x="1260.00" y="439.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#111">2× PI7C9X2G404SL: VDDR/CVDDR/AVDDH ~0.12 A mỗi chip</text>
<text x="1260.00" y="460.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#111">LED RJ45 LAN</text>
<polyline points="990.0,425.0 1060.0,425.0" fill="none" stroke="#c77700" stroke-width="2.5"/>
<polygon points="1060.0,425.0 1050.8,428.9 1050.8,421.1" fill="#c77700"/>
<rect x="1060.00" y="520.00" width="400.00" height="90.00" rx="8.0" fill="#f7f3ff" stroke="#234" stroke-width="2.00" fill-opacity="1.00"/>
<text x="1260.00" y="571.00" font-family="DejaVu Sans" font-size="17.0" text-anchor="middle" font-weight="bold" fill="#111"></text>
<text x="1260.00" y="545.00" font-family="DejaVu Sans" font-size="15.0" text-anchor="middle" font-weight="bold" fill="#111">+1V0 (tải tối đa ~1.35 A)</text>
<text x="1260.00" y="568.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#111">2× PI7C9X2G404SL: VDDC + AVDD + VDDCAUX</text>
<text x="1260.00" y="589.00" font-family="DejaVu Sans" font-size="13.0" text-anchor="middle" font-weight="normal" fill="#111">điển hình 0.27 A, tối đa 0.68 A mỗi chip</text>
<polyline points="990.0,565.0 1060.0,565.0" fill="none" stroke="#c77700" stroke-width="2.5"/>
<polygon points="1060.0,565.0 1050.8,568.9 1050.8,561.1" fill="#c77700"/>
<rect x="1060.00" y="680.00" width="190.00" height="70.00" rx="8.0" fill="#e9e9e9" stroke="#234" stroke-width="2.00" fill-opacity="1.00"/>
